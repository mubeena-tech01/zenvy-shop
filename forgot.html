<!DOCTYPE html>
<html>
<head>
<title>Forgot Password</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#d6b89f;
    font-family:Arial;
}

.container{
    width:360px;
    padding:35px;
    text-align:center;
}

.logo{
    width:70px;
    height:70px;
    border-radius:50%;
    margin-bottom:10px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    background:#f5eee7;
}

button{
    width:100%;
    padding:12px;
    background:#b89474;
    color:white;
    border:none;
    border-radius:10px;
    margin-top:10px;
    cursor:pointer;
}

/* MESSAGE */
#msg{
    margin-top:10px;
    font-size:14px;
}
.success{
    color:green;
}
.error{
    color:red;
}
</style>

</head>

<body>

<div class="container">

<img src="logozenvy.jpeg" class="logo">

<h2>Forgot Password</h2>

<form onsubmit="sendOTP(event)">
    <input type="email" id="email" placeholder="Enter your email" required>
    <button type="submit">Send OTP</button>
</form>

<p id="msg"></p>

</div>

<script>

function sendOTP(e){
    e.preventDefault(); // 🚫 stop page reload

    let email = document.getElementById("email").value;
    let msg = document.getElementById("msg");

    msg.innerText = "Sending OTP...";
    msg.className = "";

    fetch("send_reset_otp.php", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: "email=" + encodeURIComponent(email)
    })
    .then(res => res.text())
    .then(data => {

        if(data.includes("success")){
            msg.innerText = data;
            msg.className = "success";

            // ⏳ redirect after 1.5 sec
            setTimeout(() => {
                window.location.href = "verify_otp.php";
            }, 1500);

        } else {
            msg.innerText = data;
            msg.className = "error";
        }

    })
    .catch(() => {
        msg.innerText = "Something went wrong ❌";
        msg.className = "error";
    });
}

</script>

</body>
</html>
