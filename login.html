<!DOCTYPE html>
<html>
<head>
<title>Zenvy Login</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#d6b89f;
    font-family:Arial;
}

.container{
    width:360px;
    padding:35px;
    border-radius:30px;
    text-align:center;
}

.logo{
    width:70px;
    height:70px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:10px;
}

h1{
    margin:10px 0;
    font-size:28px;
}

p{
    color:#3b3b3b;
    font-size:14px;
    margin-bottom:20px;
}

.form-group{
    position:relative;
}

/* INPUT */
.form-group input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    outline:none;
    background:#f5eee7;
    box-sizing:border-box;
}

/* PASSWORD EYE */
.form-group.password-box input{
    padding-right:45px;
}

.form-group.password-box i{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#555;
}

button{
    width:100%;
    padding:12px;
    background:#b89474;
    color:white;
    border:none;
    border-radius:10px;
    margin-top:15px;
    cursor:pointer;
    font-size:16px;
}

a{
    color:#3b5edb;
    font-size:14px;
    text-decoration:none;
}

.extra{
    margin-top:15px;
}
</style>

</head>

<body>

<div class="container">

<img src="logozenvy.jpeg" class="logo">

<h1>Welcome!</h1>
<p>Login to continue your shopping journey</p>

<form action="login.php" method="POST">

    <!-- EMAIL -->
    <div class="form-group">
        <input type="text" name="email" placeholder="Enter Email" required>
    </div>

    <!-- PASSWORD WITH EYE -->
    <div class="form-group password-box">
        <input type="password" id="password" name="password" placeholder="Enter Password" required>
        <i class="fa-solid fa-eye" onclick="togglePass()"></i>
    </div>

    <button type="submit">Login</button>

</form>

<!-- FORGOT PASSWORD -->
<a href="forgot.html">Forgot Password?</a>

<div class="extra">
    <p>Don't have account?</p>
    <a href="signup.html">Sign Up Now</a>
</div>

</div>

<script>

// 👁️ TOGGLE PASSWORD
function togglePass(){
    let input = document.getElementById("password");
    let icon = document.querySelector(".password-box i");

    if(input.type === "password"){
        input.type = "text";
        icon.classList.replace("fa-eye","fa-eye-slash");
    } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash","fa-eye");
    }
}

</script>

</body>
</html>
