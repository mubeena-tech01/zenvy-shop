<!DOCTYPE html>
<html>
<head>
<title>Zenvy Shop</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#f2e4d7;
    font-family:Arial;
}

/* LOGO */
.logo{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:50%;
    margin-bottom:15px;
}

/* LOADING DOTS */
.dots{
    display:flex;
    gap:6px;
}

.dot{
    width:8px;
    height:8px;
    background:#333;
    border-radius:50%;
    animation:blink 1.4s infinite;
}

.dot:nth-child(2){
    animation-delay:0.2s;
}
.dot:nth-child(3){
    animation-delay:0.4s;
}

@keyframes blink{
    0%, 80%, 100%{ opacity:0.2; }
    40%{ opacity:1; }
}
</style>

<script>
setTimeout(() => {
    window.location.href = "login.html";
}, 3000);
</script>

</head>

<body>

<!-- LOGO -->
<img src="logozenvy.jpeg" class="logo" alt="Logo">

<!-- LOADING DOTS -->
<div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</div>

</body>
</html>
