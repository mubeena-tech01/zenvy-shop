<!DOCTYPE html>
<html>
<head>
<title>Zenvy Signup</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#d6b89f;
    font-family:Arial;
}

.container{
    width:360px;
    padding:35px;
    border-radius:30px;
    text-align:center;
}

.logo{
    width:70px;
    height:70px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:10px;
}

.form-group{
    width:100%;
    margin:10px 0;
}

.form-group input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#f5eee7;
    box-sizing:border-box;
}

/* PASSWORD */
.password-box{
    position:relative;
}

.password-box input{
    padding-right:45px;
}

.password-box i{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#555;
}

/* OTP ROW */
.otp-row{
    display:flex;
    gap:10px;
    align-items:center;
}

.otp-row input{
    flex:1;
}

.otp-row button{
    width:auto;
    padding:12px;
    white-space:nowrap;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    background:#b89474;
    color:white;
    border:none;
    border-radius:10px;
    margin-top:15px;
    cursor:pointer;
}

a{
    color:#3b5edb;
    text-decoration:none;
}
</style>

</head>

<body>

<div class="container">

<img src="logozenvy.jpeg" class="logo">

<h2>Create Account</h2>

<form action="signup.php" method="POST" onsubmit="return validateForm()">

<div class="form-group">
<input type="text" name="name" placeholder="Full Name" required>
</div>

<div class="form-group">
<input type="email" id="email" name="email" placeholder="Email" required>
</div>

<div class="form-group">
<input type="tel" name="phone" id="phone"
pattern="[6-9]{1}[0-9]{9}"
maxlength="10"
placeholder="Phone Number"
required
oninput="this.value=this.value.replace(/[^0-9]/g,'')">
</div>

<!-- PASSWORD -->
<div class="form-group password-box">
<input type="password" id="password" name="password" placeholder="Password" required>
<i class="fa-solid fa-eye" onclick="togglePass('password', this)"></i>
</div>

<!-- CONFIRM PASSWORD -->
<div class="form-group password-box">
<input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
<i class="fa-solid fa-eye" onclick="togglePass('confirm_password', this)"></i>
</div>

<!-- OTP -->
<div class="form-group otp-row">
    <input type="text" id="otp" name="otp" placeholder="Enter OTP" required>
    <button type="button" onclick="sendOTP()">Send OTP</button>
</div>

<button type="submit" name="signup">Sign up</button>

</form>

<p>Already have an account? <a href="login.html">Login</a></p>

</div>

<script>

// 👁️ TOGGLE PASSWORD
function togglePass(id, icon){
    let input = document.getElementById(id);

    if(input.type === "password"){
        input.type = "text";
        icon.classList.replace("fa-eye","fa-eye-slash");
    } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash","fa-eye");
    }
}

// 📩 SEND OTP (REAL)
function sendOTP(){
    let email = document.getElementById("email").value;

    if(email === ""){
        alert("Enter email first ❌");
        return;
    }

    fetch("send_otp.php", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: "email=" + encodeURIComponent(email)
    })
    .then(response => response.text())
    .then(data => {
        alert(data);
    });
}

function validateForm(){
    let email = document.getElementById("email").value;
    let pass = document.getElementById("password").value;
    let confirm = document.getElementById("confirm_password").value;
    let otp = document.getElementById("otp").value;
    let phone = document.getElementById("phone").value;

    let specialChar = /[!@#$%^&*(),.?":{}|<>]/;
    let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    let phonePattern = /^[6-9]\d{9}$/;
    if(!emailPattern.test(email)){
        alert("Enter valid email ❌");
        return false;
    }

    // ✅ PHONE VALIDATION
    if(!phonePattern.test(phone)){
        alert("Enter valid 10-digit Indian phone number ❌");
        return false;
    }
    if(!specialChar.test(pass)){
        alert("Password must contain special character ❌");
        return false;
    }
    if(pass !== confirm){
        alert("Passwords do not match ❌");
        return false;
    }
    if(otp === ""){
        alert("Enter OTP ❌");
        return false;
    }
    return true;
}
</script>
</body>
</html>
